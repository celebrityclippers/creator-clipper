name: Run Creator Clipper Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # THIS STEP AUTOMATICALLY UPDATES AND INSTALLS ALL REQUIRED LIBRARIES
      - name: Install and Upgrade Python Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      # Restores your secure secret token into a local file cleanly
      - name: Recreate token.json
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      - name: Execute Video Pipeline Configuration
        run: |
          python pipeline.py
