name: Run Creator Clipper Bot

on:
  # Allows you to run the bot manually from the GitHub Actions tab anytime
  workflow_dispatch:
  
  # Automatically runs the bot every day at 12:00 PM UTC
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up future runs

      # 3. Install your bot dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      # 4. SECURELY RECREATE THE TOKEN FILE FROM YOUR GITHUB SECRET
      - name: Recreate token.json
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      # 5. Run your main clipper bot script
      - name: Execute Bot Script
        run: |
          python main.py
