name: Run Creator Clipper Bot

on:
  workflow_dispatch: # Allows you to press a button on GitHub to test run it anytime
  schedule:
    - cron: '0 12 * * *' # Automatically runs every single day at 12:00 PM UTC

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # CRITICAL: Installs system media codecs so the cloud server can process video
      - name: Install FFmpeg System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      # Restores your secure secret token into a local file cleanly
      - name: Recreate token.json
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      - name: Execute Video Pipeline Configuration
        run: |
          python pipeline.py
